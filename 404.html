<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina niet gevonden - MinBZK</title>
    <script>
        // Functie om redirect uit te voeren voor algoritmekader naar Algoritmekader
        (function() {
            var path = window.location.pathname;
            
            // Check voor kleine letter algoritmekader in het pad
            if (path.toLowerCase().includes('/algoritmekader/')) {
                // Huidige situatie: redirect van /algoritmekader/ naar /Algoritmekader/
                var newPath = path.replace(/\/algoritmekader\//i, '/Algoritmekader/');
                
                // Als toekomstige situatie omgekeerd wordt (Algoritmekader naar algoritmekader)
                // Uncomment deze code en comment de bovenstaande regel
                // var newPath = path.replace(/\/Algoritmekader\//i, '/algoritmekader/');
                
                window.location.href = window.location.origin + newPath;
            } else {
                // Voor andere 404's, stuur naar de homepage
                window.location.href = "/";
            }
        })();
    </script>
</head>
<body>
    <h1>Pagina niet gevonden</h1>
    <p>De pagina die u zoekt, bestaat niet. U wordt doorgestuurd...</p>
</body>
</html>
