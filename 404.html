<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina niet gevonden - MinBZK</title>
    <script>
        // Redirects voor verhuisde sites
        (function() {
            var path = window.location.pathname;

            // Sites die naar een andere organisatie zijn verhuisd. GitHub stuurt
            // een Pages-adres na een verhuizing niet zelf door, dus dat gebeurt
            // hier: het pad achter de sitenaam, de zoekopdracht en het anker
            // gaan mee naar het nieuwe adres.
            var moved = {
                'nerds': 'https://nerds.digitaledienst.overheid.nl',
                'storybook': 'https://nederlandsedigitaledienst.github.io/design-system',
                'regelrecht': 'https://regelrecht.rijks.app',
                'algoritmekader': 'https://algoritmes.overheid.nl/nl/algoritmekader'
            };
            var site = path.split('/')[1] || '';
            var target = moved[site.toLowerCase()];
            if (target) {
                var rest = path.slice(site.length + 1);
                window.location.replace(target + rest + window.location.search + window.location.hash);
                return;
            }

            // Andere 404's gaan naar de homepage
            window.location.href = "/";
        })();
    </script>
</head>
<body>
    <h1>Pagina niet gevonden</h1>
    <p>De pagina die u zoekt, bestaat niet. U wordt doorgestuurd...</p>
</body>
</html>
